services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
      DATA_DIR: /app/data
    volumes:
      - progress:/app/data
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  progress:
  caddy_data:
  caddy_config:
